spring:
  application:
    name: stock-data-aggregation-service
  cassandra:
    contact-points: localhost
    port: 9042
    keyspace-name: stock_keyspace
    local-datacenter: datacenter1
    schema-action: none

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

cache:
  caffeine:
    spec: maximumSize=500,expireAfterWrite=5m
